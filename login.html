
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MediQuick Pharmacy</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-section {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: #EAF3FF;
        }

        .auth-container {
            background: #FFFFFF;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
        }

        .auth-container h2 {
            text-align: center;
            color: #1565C0;
            margin-bottom: 10px;
        }

        .auth-description {
            text-align: center;
            color: #666666;
            margin-bottom: 25px;
        }

        .auth-form label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        .auth-form input {
            width: 100%;
            padding: 12px;
            border: 1px solid #CCCCCC;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .auth-submit {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #1565C0;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .auth-submit:hover {
            background: #0D47A1;
        }

        .auth-message {
            text-align: center;
            margin-top: 15px;
            color: #1565C0;
        }

        .hidden {
            display: none;
        }

        .auth-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .back-home {
            color: #1565C0;
            text-decoration: none;
            font-size: 14px;
        }

        .register-small-btn {
            background: #1565C0;
            color: #FFFFFF;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .register-small-btn:hover {
            background: #0D47A1;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="container">

            <h1 class="logo">MediQuick Pharmacy</h1>

            <nav>
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="contact.html">Contact</a>
            </nav>

        </div>
    </header>


    <!-- Login and Register Section -->
    <section class="auth-section">

        <div class="auth-container">

            <h2 id="formTitle">Welcome Back!</h2>

            <p class="auth-description" id="formDescription">
                Login to your MediQuick account
            </p>


            <!-- Login Form -->
            <form id="loginForm" class="auth-form">

                <label for="loginEmail">Email Address</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="auth-submit">
                    Login
                </button>

                <p id="loginMessage" class="auth-message"></p>

            </form>


            <!-- Register Form -->
            <form id="registerForm" class="auth-form hidden">

                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="registerEmail">Email Address</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="registerPassword">Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

                <button type="submit" class="auth-submit">
                    Create Account
                </button>

                <p id="registerMessage" class="auth-message"></p>

            </form>


            <!-- Back Home and Register Buttons -->
            <div class="auth-footer">

                <a href="index.html" class="back-home">
                    ← Back to Home
                </a>

                <button
                    type="button"
                    class="register-small-btn"
                    id="registerButton"
                    onclick="showRegister()"
                >
                    Register
                </button>

                <button
                    type="button"
                    class="register-small-btn hidden"
                    id="loginButton"
                    onclick="showLogin()"
                >
                    Login
                </button>

            </div>

        </div>

    </section>


    <!-- JavaScript -->
    <script>

        // Display Login Form
        function showLogin() {

            document.getElementById("loginForm").classList.remove("hidden");

            document.getElementById("registerForm").classList.add("hidden");

            document.getElementById("formTitle").textContent = "Welcome Back!";

            document.getElementById("formDescription").textContent =
                "Login to your MediQuick account";

            document.getElementById("registerButton").classList.remove("hidden");

            document.getElementById("loginButton").classList.add("hidden");
        }


        // Display Register Form
        function showRegister() {

            document.getElementById("registerForm").classList.remove("hidden");

            document.getElementById("loginForm").classList.add("hidden");

            document.getElementById("formTitle").textContent = "Create Account";

            document.getElementById("formDescription").textContent =
                "Register for your MediQuick account";

            document.getElementById("registerButton").classList.add("hidden");

            document.getElementById("loginButton").classList.remove("hidden");
        }


        // Login Form Validation
        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            document.getElementById("loginMessage").textContent =
                "Login form validated. Backend authentication is not connected yet.";

        });


        // Registration Form Validation
        document.getElementById("registerForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const password =
                document.getElementById("registerPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {

                document.getElementById("registerMessage").textContent =
                    "Passwords do not match!";

                return;
            }

            document.getElementById("registerMessage").textContent =
                "Registration form validated. Backend is not connected yet.";

        });

    </script>

</body>
</html>
